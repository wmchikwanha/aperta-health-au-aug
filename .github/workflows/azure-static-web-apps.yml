name: Deploy Aperta to Azure Static Web Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Install and build
        env:
          VITE_SUPABASE_URL: https://pytvadhrygzyvjvgjqob.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB5dHZhZGhyeWd6eXZqdmdqcW9iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwOTQ4MzgsImV4cCI6MjA5NjY3MDgzOH0.oIwZu5XvwDXjvNv5hUT9Wwx_surPtqtfLfr0Uo3E3a4
        run: |
          npm ci || npm install
          npm run build
      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true
          output_location: ''
